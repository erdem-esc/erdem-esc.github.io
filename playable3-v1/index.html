<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Roguelike Shooter Playable</title>
    <style>
        @font-face {
            font-family: 'Lilita One';
            font-style: normal;
            font-weight: 400;
            src: url('assets/LilitaOne.ttf') format('truetype');
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-canvas {
            display: block;
            background: #16213e;
        }
        #ui-layer {
            position: absolute;
            pointer-events: none;
            overflow: visible;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        #upgrade-panel {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: transparent;
            padding: 8px;
            text-align: center;
            display: none;
            pointer-events: auto;
        }
        .level-up-banner {
            display: inline-block;
            background-image: url('assets/ribbon_yellow.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            color: #fff;
            font-family: 'Lilita One', cursive;
            font-size: 22px;
            font-weight: bold;
            padding: 16px 60px;
            -webkit-text-stroke: 0.8px #000;
            margin-bottom: 4px;
            position: relative;
        }
        #upgrade-panel .subtitle {
            color: #dfd601;
            font-family: 'Lilita One', cursive;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            -webkit-text-stroke: 0.5px #000;
            animation: fadeInOut 2s infinite;
        }
        #skill-buttons {
            display: flex;
            flex-direction: row;
            gap: 4px;
            justify-content: center;
            width: 100%;
            margin-top: -8px;
        }
        .upgrade-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 110px;
            height: 275px;
            padding: 0;
            color: white;
            font-family: 'Lilita One', cursive;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            border: none;
            background-image: url('assets/itemselect.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: top center;
            background-color: transparent;
            position: relative;
        }
        .upgrade-btn:active {
            transform: scale(0.95);
        }
        .upgrade-btn .rarity {
            margin-top: 26px;
            font-size: 14px;
            color: #fff;
            -webkit-text-stroke: 0.6px #000;
        }
        .upgrade-btn .skill-name {
            margin-top: 10px;
            font-size: 18px;
            -webkit-text-stroke: 0.7px #000;
        }
        .upgrade-btn .icon {
            width: 70px;
            height: 70px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upgrade-btn .icon img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        .upgrade-btn .description {
            margin-top: 4px;
            font-size: 14px;
            color: #fff;
            text-align: center;
            padding: 0 10px;
            -webkit-text-stroke: 0.6px #000;
            max-width: 95%;
            line-height: 1.3;
        }
        #cta-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        #cta-screen.visible {
            opacity: 1;
        }
        #cta-endcard {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #cta-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            padding: 20px 32px;
            background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
            border: 3px solid #86efac;
            border-radius: 16px;
            color: white;
            font-family: 'Lilita One', cursive;
            font-size: 48px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }
        #cta-btn.landscape {
            bottom: auto;
            top: 30px;
            left: auto;
            right: 30px;
            transform: none;
            padding: 12px 32px;
            font-size: 32px;
            border-radius: 12px;
            animation: pulse-landscape 1.5s infinite;
        }
        @keyframes pulse-landscape {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        #tutorial-hint {
            position: absolute;
            bottom: 27.5%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.8);
            font-family: 'Lilita One', cursive;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            animation: fadeInOut 2s infinite;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        #xp-bar-container {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        #xp-bar-bg {
            width: 100%;
            height: 20px;
            background-image: url('assets/xpbar.png');
            background-size: 100% 100%;
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            padding: 3px;
            z-index: 2;
        }
        #xp-bar-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #3a3a4a 0%, #252535 100%);
            border-radius: 2px;
            overflow: hidden;
        }
        #xp-bar {
            height: 100%;
            width: 0%;
            background-color: #7ed321;
            background-image: linear-gradient(180deg, #a4e84b 0%, #7ed321 50%, #5fb315 100%);
            border-radius: 2px;
            transition: width 0.2s;
        }
        #level-display {
            color: #fff;
            font-family: 'Lilita One', cursive;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            margin-top: -4px;
            padding: 5px 24px 6px 6px;
            background-image: url('assets/tab_level.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            display: inline-block;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div id="xp-bar-container">
                <div id="xp-bar-bg">
                    <div id="xp-bar-inner">
                        <div id="xp-bar"></div>
                    </div>
                </div>
                <span id="level-display">LVL 1</span>
            </div>
            <div id="tutorial-hint">Drag to move</div>
            <div id="upgrade-panel">
                <div class="level-up-banner">Level Up</div>
                <div class="subtitle">Choose a new item!</div>
                <div id="skill-buttons"></div>
            </div>
            <div id="cta-screen">
                <img id="cta-endcard" src="assets/ps-endcard-vertical-image.png" alt="Endcard">
                <button id="cta-btn">PLAY NOW</button>
            </div>
        </div>
    </div>

    <script>
    // ============================================
    // MRAID 2.0 Integration (for ad networks)
    // ============================================
    var mraidReady = false;
    var gameStarted = false;
    var isViewable = false;

    function initMRAID() {
        // Check if MRAID exists
        if (typeof mraid === 'undefined') {
            // No MRAID - browser testing mode
            mraidReady = true;
            isViewable = true;
            return;
        }

        // MRAID 2.0 pattern: check getState first
        if (mraid.getState() === 'loading') {
            // MRAID still loading, wait for ready
            mraid.addEventListener('ready', onMRAIDReady);
        } else {
            // MRAID already ready
            onMRAIDReady();
        }
    }

    function onMRAIDReady() {
        mraidReady = true;

        // Required: Listen for viewableChange events (MRAID 2.0)
        mraid.addEventListener('viewableChange', onViewableChange);

        // Required: Listen for stateChange events (MRAID 2.0)
        mraid.addEventListener('stateChange', onStateChange);

        // Required: Check initial viewable state
        if (mraid.isViewable()) {
            onViewableChange(true);
        }
    }

    function onViewableChange(viewable) {
        isViewable = viewable;
        if (viewable && !gameStarted) {
            tryStartGame();
        } else if (!viewable && gameStarted) {
            // Pause game when not viewable
            game.paused = true;
        } else if (viewable && gameStarted) {
            // Resume game when viewable again
            game.paused = false;
        }
    }

    function onStateChange(state) {
        // Handle state changes (default, expanded, resized, hidden)
        if (state === 'hidden') {
            game.paused = true;
        }
    }

    function tryStartGame() {
        if (spritesLoaded && !gameStarted && isViewable && mraidReady) {
            gameStarted = true;
            startGame();
        }
    }

    function openStore(url) {
        if (typeof mraid !== 'undefined' && typeof mraid.open === 'function') {
            mraid.open(url);
        } else {
            window.open(url, '_blank');
        }
    }

    // ============================================
    // Configuration
    // ============================================
    const CONFIG = {
        // Store URL - REPLACE WITH YOUR ACTUAL STORE LINKS
        STORE_URL_IOS: 'https://apps.apple.com/gb/app/portal-survivor/id6754314383',
        STORE_URL_ANDROID: 'https://play.google.com/store/apps/details?id=com.escape.portalsurvivor',

        // Gameplay tuning
        PLAYER_SPEED: 3,
        BULLET_SPEED: 3,
        BULLET_FIRE_RATE: 0.5, // seconds between shots
        ENEMY_SPEED: 1,
        ENEMY_SPAWN_MARGIN: 10, // distance outside screen to spawn enemies
        XP_ATTRACT_SPEED: 8,
        XP_ATTRACT_RADIUS: 80,

        // XP required for each level up
        XP_TO_LEVEL_2: 8,
        XP_TO_LEVEL_3: 20,
        XP_TO_LEVEL_4: 30,  // CTA triggers at level 4

        // Enemy spawn rates (enemies per second) by phase
        SPAWN_RATE_PHASE_1: 2,   // Before first upgrade
        SPAWN_RATE_PHASE_2: 3,   // After first upgrade
        SPAWN_RATE_PHASE_3: 4,   // After second upgrade

        // Max enemies on screen by phase
        MAX_ENEMIES_PHASE_1: 5,
        MAX_ENEMIES_PHASE_2: 10,
        MAX_ENEMIES_PHASE_3: 15,

        // Orbital settings
        ORBITAL_COUNT: 1,
        ORBITAL_RADIUS: 50,
        ORBITAL_SPEED: 3,
        ORBITAL_DAMAGE: 2,

        // Game flow

        // Colors (replace with sprite loading later)
        COLOR_PLAYER: '#4ade80',
        COLOR_ENEMY: '#ef4444',
        COLOR_BULLET: '#fbbf24',
        COLOR_XP: '#a855f7',

        // Orbital types with colors and sprites
        ORBITAL_TYPES: {
            fire: { name: 'Fire', color: '#ef4444', cssClass: 'fire', sprite: 'assets/Fire_orbital.png', orbSprite: 'assets/fireorbital.png', description: 'Burn your enemies' },
            ice: { name: 'Frozen', color: '#3b82f6', cssClass: 'ice', sprite: 'assets/Frozen_orbital.png', orbSprite: 'assets/iceorbital.png', description: 'Freeze your enemies' },
            poison: { name: 'Poison', color: '#a855f7', cssClass: 'poison', sprite: 'assets/Poisonous_orbital.png', orbSprite: 'assets/poisonorbital.png', description: 'Poison your enemies' },
            shock: { name: 'Shock', color: '#eab308', cssClass: 'shock', sprite: 'assets/Lightning_orbital.png', orbSprite: 'assets/lightningorbital.png', description: 'Shock your enemies' }
        },

        // Sprite paths
        SPRITES: {
            xpOrb: 'assets/Xpgem.png',
            background: 'assets/map_long.png',
            bullet: 'assets/bullet.png',
            enemy1: 'assets/enemy1.png',
            enemy2: 'assets/enemy2.png',
            enemy3: 'assets/enemy3.png',
            player: 'assets/character.png'
        }
    };

    // ============================================
    // Sprite Loading
    // ============================================
    const sprites = {};
    const sounds = {};
    let spritesLoaded = false;

    // Animation frames
    const charWalkFrames = [];
    const goblinWalkFrames = [];
    const rangeWalkFrames = [];
    const skeletonWalkFrames = [];
    const CHAR_WALK_PATHS = ['assets/chars/Character_walk0000.png', 'assets/chars/Character_walk0004.png', 'assets/chars/Character_walk0008.png', 'assets/chars/Character_walk0012.png', 'assets/chars/Character_walk0016.png', 'assets/chars/Character_walk0021.png'];
    const GOBLIN_WALK_PATHS = ['assets/chars/Goblin_walk_0000.png', 'assets/chars/Goblin_walk_0002.png', 'assets/chars/Goblin_walk_0004.png', 'assets/chars/Goblin_walk_0006.png', 'assets/chars/Goblin_walk_0008.png', 'assets/chars/Goblin_walk_0010.png'];
    const RANGE_WALK_PATHS = ['assets/chars/Range_Walk0000.png', 'assets/chars/Range_Walk0002.png', 'assets/chars/Range_Walk0004.png', 'assets/chars/Range_Walk0006.png', 'assets/chars/Range_Walk0008.png', 'assets/chars/Range_Walk0010.png'];
    const SKELETON_WALK_PATHS = ['assets/chars/Sekeleton_walk0000.png', 'assets/chars/Sekeleton_walk0002.png', 'assets/chars/Sekeleton_walk0004.png', 'assets/chars/Sekeleton_walk0006.png', 'assets/chars/Sekeleton_walk0008.png', 'assets/chars/Sekeleton_walk0010.png'];
    const EXPLOSION_PATHS = {
        fire: ['assets/explodes/fire-1.png', 'assets/explodes/fire-2.png', 'assets/explodes/fire-3.png', 'assets/explodes/fire-4.png', 'assets/explodes/fire-5.png', 'assets/explodes/fire-6.png'],
        ice: ['assets/explodes/ice-1.png', 'assets/explodes/ice-2.png', 'assets/explodes/ice-3.png', 'assets/explodes/ice-4.png', 'assets/explodes/ice-5.png', 'assets/explodes/ice-6.png'],
        poison: ['assets/explodes/poison-1.png', 'assets/explodes/poison-2.png', 'assets/explodes/poison-3.png', 'assets/explodes/poison-4.png', 'assets/explodes/poison-5.png', 'assets/explodes/poison-6.png'],
        shock: ['assets/explodes/shock-1.png', 'assets/explodes/shock-2.png', 'assets/explodes/shock-3.png', 'assets/explodes/shock-4.png', 'assets/explodes/shock-5.png', 'assets/explodes/shock-6.png']
    };

    // Explosion frames per element type (6 frames each)
    const explosionFrames = {
        fire: [],
        ice: [],
        poison: [],
        shock: []
    };
    const EXPLOSION_TYPES = ['fire', 'ice', 'poison', 'shock'];
    const EXPLOSION_FRAME_COUNT = 6;
    let explosionIndex = 0; // Cycle through selected orbital types
    let bulletIndex = 0; // Cycle through selected orbital types for bullets

    function loadSprites(callback) {
        const toLoad = [
            { key: 'xpOrb', src: CONFIG.SPRITES.xpOrb },
            { key: 'background', src: CONFIG.SPRITES.background },
            { key: 'bullet', src: CONFIG.SPRITES.bullet },
            { key: 'bullet_fire', src: 'assets/bullet-fire.png' },
            { key: 'bullet_ice', src: 'assets/bullet-ice.png' },
            { key: 'bullet_poison', src: 'assets/bullet-poison.png' },
            { key: 'bullet_shock', src: 'assets/bullet-shock.png' },
            { key: 'enemy1', src: CONFIG.SPRITES.enemy1 },
            { key: 'enemy2', src: CONFIG.SPRITES.enemy2 },
            { key: 'enemy3', src: CONFIG.SPRITES.enemy3 },
            { key: 'player', src: CONFIG.SPRITES.player },
            { key: 'orbital_fire', src: CONFIG.ORBITAL_TYPES.fire.orbSprite },
            { key: 'orbital_ice', src: CONFIG.ORBITAL_TYPES.ice.orbSprite },
            { key: 'orbital_poison', src: CONFIG.ORBITAL_TYPES.poison.orbSprite },
            { key: 'orbital_shock', src: CONFIG.ORBITAL_TYPES.shock.orbSprite },
            { key: 'bullets_fire', src: 'assets/burning_bullets.png' },
            { key: 'bullets_ice', src: 'assets/freezing_bullets.png' },
            { key: 'bullets_poison', src: 'assets/poisonous_bullets.png' },
            { key: 'bullets_shock', src: 'assets/shocking_bullets.png' },
            { key: 'endcard_horizontal', src: 'assets/ps-endcard-horizontal-image.png' },
            { key: 'endcard_vertical', src: 'assets/ps-endcard-vertical-image.png' }
        ];

        // Add character walk frames
        CHAR_WALK_PATHS.forEach((path, idx) => {
            toLoad.push({ key: 'char_walk_' + idx, src: path });
        });

        // Add goblin walk frames (enemy1)
        GOBLIN_WALK_PATHS.forEach((path, idx) => {
            toLoad.push({ key: 'goblin_walk_' + idx, src: path });
        });

        // Add range walk frames (enemy2)
        RANGE_WALK_PATHS.forEach((path, idx) => {
            toLoad.push({ key: 'range_walk_' + idx, src: path });
        });

        // Add skeleton walk frames (enemy3)
        SKELETON_WALK_PATHS.forEach((path, idx) => {
            toLoad.push({ key: 'skeleton_walk_' + idx, src: path });
        });

        // Add explosion frames for each element type
        EXPLOSION_TYPES.forEach(type => {
            EXPLOSION_PATHS[type].forEach((path, i) => {
                toLoad.push({ key: 'explosion_' + type + '_' + (i + 1), src: path });
            });
        });

        let loaded = 0;
        const total = toLoad.length;
        let callbackCalled = false;

        function onComplete() {
            if (!callbackCalled) {
                callbackCalled = true;
                spritesLoaded = true;

                // Populate animation frame arrays
                for (let i = 0; i < CHAR_WALK_PATHS.length; i++) {
                    if (sprites['char_walk_' + i]) charWalkFrames.push(sprites['char_walk_' + i]);
                }
                for (let i = 0; i < GOBLIN_WALK_PATHS.length; i++) {
                    if (sprites['goblin_walk_' + i]) goblinWalkFrames.push(sprites['goblin_walk_' + i]);
                }
                for (let i = 0; i < RANGE_WALK_PATHS.length; i++) {
                    if (sprites['range_walk_' + i]) rangeWalkFrames.push(sprites['range_walk_' + i]);
                }
                for (let i = 0; i < SKELETON_WALK_PATHS.length; i++) {
                    if (sprites['skeleton_walk_' + i]) skeletonWalkFrames.push(sprites['skeleton_walk_' + i]);
                }
                // Populate explosion frames for each element type
                EXPLOSION_TYPES.forEach(type => {
                    EXPLOSION_PATHS[type].forEach((path, i) => {
                        if (sprites['explosion_' + type + '_' + (i + 1)]) {
                            explosionFrames[type].push(sprites['explosion_' + type + '_' + (i + 1)]);
                        }
                    });
                });

                callback();
            }
        }

        // Fallback timeout - start game after 2 seconds even if sprites fail
        setTimeout(onComplete, 2000);

        toLoad.forEach(item => {
            const img = new Image();
            img.onload = () => {
                sprites[item.key] = img;
                loaded++;
                if (loaded === total) {
                    onComplete();
                }
            };
            img.onerror = () => {
                loaded++;
                if (loaded === total) {
                    onComplete();
                }
            };
            img.src = item.src;
        });
    }

    function loadSounds() {
        const audioFiles = [
            { key: 'buttonClick', src: 'assets/ButtonClick.wav' },
            { key: 'explosion', src: 'assets/weapon3.mp3' },
            { key: 'coin', src: 'assets/Coin.wav' }
        ];
        audioFiles.forEach(item => {
            const audio = new Audio(item.src);
            audio.preload = 'auto';
            audio.load();
            sounds[item.key] = audio;
        });
    }

    function playSound(key) {
        if (sounds[key]) {
            try {
                const sound = sounds[key].cloneNode();
                sound.volume = key === 'explosion' ? 0.3 : key === 'coin' ? 0.3 : 0.5;
                if (key === 'explosion') sound.currentTime = 0.2; // Skip silent part
                sound.play().catch(function(e) {});
            } catch(e) {}
        }
    }

    // ============================================
    // Game State
    // ============================================
    const game = {
        canvas: null,
        ctx: null,
        width: 360,
        height: 640,
        scale: 1,
        isLandscape: false,
        running: false,
        paused: false,
        lastTime: 0,
        deltaTime: 0,

        // Input
        touch: { active: false, x: 0, y: 0 },

        // Entities
        player: null,
        bullets: [],
        enemies: [],
        xpOrbs: [],
        orbitals: [],
        explosions: [],

        // Timers
        fireTimer: 0,
        spawnTimer: 0,
        backgroundY: 0, // Background scroll offset

        // Animation state
        playerAnimTime: 0,
        playerAnimFrame: 0,
        enemyAnimTime: 0,
        enemyAnimFrame: 0,

        // Progression
        xp: 0,
        level: 1,
        kills: 0,
        killsAfterSecondUpgrade: 0, // Track kills after both upgrades for CTA
        selectedOrbitalTypes: [], // Track which orbital types player has chosen
        tutorialShown: true,
        ctaShown: false,
        waitingForExplosions: false,

        // Bar selection system
        barSelectionActive: false,
        barOptions: [], // [{type, width, icon, name}]
        barSelectionComplete: false,
        barWinnerAnimation: 0, // Timer for winner celebration animation
        barWinnerType: null, // The winning bar type
        barY: 0 // Y position of bars (starts from top, moves down)
    };

    // ============================================
    // Initialization
    // ============================================
    function init() {
        game.canvas = document.getElementById('game-canvas');
        game.ctx = game.canvas.getContext('2d');

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        setupInput();
        resetGame();
        loadSounds();

        // Initialize MRAID first
        initMRAID();

        // Load sprites, then try to start game
        loadSprites(() => {
            tryStartGame();
        });
    }

    function resizeCanvas() {
        let screenWidth = window.innerWidth || 360;
        let screenHeight = window.innerHeight || 640;

        const isLandscape = screenWidth > screenHeight;
        game.isLandscape = false; // Always treat as portrait for gameplay

        let DESIGN_WIDTH, DESIGN_HEIGHT, displayWidth, displayHeight, scale;

        if (isLandscape) {
            // Landscape screen: force 9:16 aspect ratio, centered
            DESIGN_WIDTH = 360;
            DESIGN_HEIGHT = 640;
            displayHeight = screenHeight;
            displayWidth = displayHeight * (9 / 16);
            scale = displayWidth / DESIGN_WIDTH;
        } else {
            // Portrait screen: use full screen resolution
            DESIGN_WIDTH = 360;
            DESIGN_HEIGHT = Math.round(DESIGN_WIDTH * (screenHeight / screenWidth));
            displayWidth = screenWidth;
            displayHeight = screenHeight;
            scale = screenWidth / DESIGN_WIDTH;
        }

        // Use device pixel ratio for crisp rendering
        const dpr = window.devicePixelRatio || 1;

        // Set canvas to design resolution * device pixel ratio
        game.canvas.width = DESIGN_WIDTH * dpr;
        game.canvas.height = DESIGN_HEIGHT * dpr;
        game.width = DESIGN_WIDTH;
        game.height = DESIGN_HEIGHT;

        // Scale context to match device pixel ratio
        game.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Scale canvas via CSS
        game.canvas.style.width = displayWidth + 'px';
        game.canvas.style.height = displayHeight + 'px';

        // Position UI layer to match canvas
        const uiLayer = document.getElementById('ui-layer');
        uiLayer.style.width = displayWidth + 'px';
        uiLayer.style.height = displayHeight + 'px';

        // Store scale for input coordinate conversion and UI scaling
        game.scale = scale;

        // Apply scale to upgrade panel
        const upgradePanel = document.getElementById('upgrade-panel');
        if (upgradePanel) {
            upgradePanel.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
            upgradePanel.style.transformOrigin = 'center center';
        }

        // XP bar width
        const xpBarContainer = document.getElementById('xp-bar-container');
        if (xpBarContainer) {
            xpBarContainer.style.width = '70%';
        }

        // Always use vertical endcard
        const endcard = document.getElementById('cta-endcard');
        if (endcard && sprites.endcard_vertical) {
            endcard.src = sprites.endcard_vertical.src;
        }

        // CTA button always in portrait position
        const ctaBtn = document.getElementById('cta-btn');
        if (ctaBtn) {
            ctaBtn.classList.remove('landscape');
        }
    }

    function resetGame() {
        game.player = {
            x: game.width / 2,
            y: game.height - 75,
            radius: 20,
            moveDirX: 0,
            moveDirY: 0,
            facingLeft: false
        };

        game.bullets = [];
        game.enemies = [];
        game.xpOrbs = [];
        game.orbitals = [];
        game.explosions = [];
        game.xp = 0;
        game.level = 1;
        game.kills = 0;
        game.killsAfterSecondUpgrade = 0;
        game.selectedOrbitalTypes = [];
        game.fireTimer = 0;
        game.spawnTimer = 0;
        game.paused = false;
        game.ctaShown = false;
        game.waitingForExplosions = false;
        game.barSelectionActive = false;
        game.barOptions = [];
        game.barSelectionComplete = false;
        game.barWinnerAnimation = 0;
        game.barWinnerType = null;
        game.barY = 0;

        updateUI();
    }

    var audioStarted = false;
    var audioContext = null;

    function startGame() {
        game.running = true;
        game.lastTime = performance.now();

        // Use requestAnimationFrame for game loop
        requestAnimationFrame(gameLoop);
    }

    function unlockAudio() {
        // Create and resume AudioContext for mobile
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === 'suspended') {
            audioContext.resume();
        }
        // Play and immediately pause all sounds to unlock them
        Object.values(sounds).forEach(sound => {
            sound.play().then(() => {
                sound.pause();
                sound.currentTime = 0;
            }).catch(() => {});
        });
    }

    function startAudioOnInteraction() {
        if (!audioStarted) {
            audioStarted = true;
            unlockAudio();
            setTimeout(() => {
                playBackgroundMusic();
            }, 100);
        }
    }

    // ============================================
    // Input Handling
    // ============================================
    function setupInput() {
        const canvas = game.canvas;

        // Touch events
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });

        // Mouse fallback (for testing)
        canvas.addEventListener('mousedown', handleMouseDown);
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mouseup', handleMouseUp);

        // UI buttons
        document.getElementById('cta-btn').addEventListener('click', handleCTA);
    }

    function handleTouchStart(e) {
        e.preventDefault();
        startAudioOnInteraction();
        const touch = e.touches[0];
        const rect = game.canvas.getBoundingClientRect();
        game.touch.active = true;
        game.touch.isDragging = false;
        game.touch.startX = (touch.clientX - rect.left) / game.scale;
        game.touch.startY = (touch.clientY - rect.top) / game.scale;
        // Clear movement direction until drag starts
        game.player.moveDirX = 0;
        game.player.moveDirY = 0;
    }

    function handleTouchMove(e) {
        e.preventDefault();
        if (!game.touch.active) return;
        const touch = e.touches[0];
        const rect = game.canvas.getBoundingClientRect();
        const touchX = (touch.clientX - rect.left) / game.scale;
        const touchY = (touch.clientY - rect.top) / game.scale;

        const dx = touchX - game.touch.startX;
        const dy = touchY - game.touch.startY;
        const dragDist = Math.sqrt(dx * dx + dy * dy);

        if (dragDist > 10 || game.touch.isDragging) {
            game.touch.isDragging = true;
            // Set normalized movement direction
            game.player.moveDirX = dx / dragDist;
            game.player.moveDirY = dy / dragDist;
            hideTutorial();
        }
    }

    function handleTouchEnd(e) {
        e.preventDefault();
        game.touch.active = false;
        game.touch.isDragging = false;
        // Stop movement
        game.player.moveDirX = 0;
        game.player.moveDirY = 0;
    }

    function handleMouseDown(e) {
        startAudioOnInteraction();
        const rect = game.canvas.getBoundingClientRect();
        game.touch.active = true;
        game.touch.isDragging = false;
        game.touch.startX = (e.clientX - rect.left) / game.scale;
        game.touch.startY = (e.clientY - rect.top) / game.scale;
        game.player.moveDirX = 0;
        game.player.moveDirY = 0;
    }

    function handleMouseMove(e) {
        if (!game.touch.active) return;
        const rect = game.canvas.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) / game.scale;
        const mouseY = (e.clientY - rect.top) / game.scale;

        const dx = mouseX - game.touch.startX;
        const dy = mouseY - game.touch.startY;
        const dragDist = Math.sqrt(dx * dx + dy * dy);

        if (dragDist > 10 || game.touch.isDragging) {
            game.touch.isDragging = true;
            game.player.moveDirX = dx / dragDist;
            game.player.moveDirY = dy / dragDist;
            hideTutorial();
        }
    }

    function handleMouseUp(e) {
        game.touch.active = false;
        game.touch.isDragging = false;
        game.player.moveDirX = 0;
        game.player.moveDirY = 0;
    }

    function hideTutorial() {
        if (game.tutorialShown) {
            game.tutorialShown = false;
            document.getElementById('tutorial-hint').style.display = 'none';
        }
    }

    // ============================================
    // Game Loop
    // ============================================
    function gameLoop(currentTime) {
        if (!game.running) return;

        game.deltaTime = Math.min((currentTime - game.lastTime) / 1000, 0.1);
        game.lastTime = currentTime;

        if (!game.paused) {
            update();
        }
        render();

        requestAnimationFrame(gameLoop);
    }

    function update() {
        updatePlayer();
        updateBullets();
        updateEnemies();
        updateXPOrbs();
        updateAnimations();
        updateExplosions();
        updateBarAnimations();
        updateBarSelection();
        updateWinnerAnimation();

        // Scroll background slowly (no reset needed, render handles wrapping)
        game.backgroundY += 0.6;

        // Auto-fire (only after player moves for first time)
        if (!game.tutorialShown) {
            game.fireTimer += game.deltaTime;
            if (game.fireTimer >= getFireInterval()) {
                fireAtNearestEnemy();
                game.fireTimer = 0;
            }
        }

        // Check if waiting for explosions to finish before showing upgrade
        if (game.waitingForExplosions && game.explosions.length === 0) {
            game.waitingForExplosions = false;
            if (game.level <= 2) {
                levelUp();
            } else if (game.level === 3 && !game.ctaShown) {
                showCTA();
            }
            return;
        }

        // Enemy spawning - rate increases with upgrades, capped by max enemies
        // Don't spawn while waiting for explosions, during bar selection, or before first player move
        if (!game.waitingForExplosions && !game.barSelectionActive && !game.tutorialShown) {
            game.spawnTimer += game.deltaTime;
            const spawnRate = getSpawnRate();
            const spawnInterval = 1 / spawnRate;
            if (game.spawnTimer >= spawnInterval) {
                if (game.enemies.length < getMaxEnemies()) {
                    spawnEnemy();
                }
                game.spawnTimer = 0;
            }
        }

        checkCollisions();
    }

    function getSpawnRate() {
        const upgradeCount = game.selectedOrbitalTypes.length;
        if (upgradeCount >= 2) return CONFIG.SPAWN_RATE_PHASE_3;
        if (upgradeCount >= 1) return CONFIG.SPAWN_RATE_PHASE_2;
        return CONFIG.SPAWN_RATE_PHASE_1;
    }

    function getMaxEnemies() {
        const upgradeCount = game.selectedOrbitalTypes.length;
        if (upgradeCount >= 2) return CONFIG.MAX_ENEMIES_PHASE_3;
        if (upgradeCount >= 1) return CONFIG.MAX_ENEMIES_PHASE_2;
        return CONFIG.MAX_ENEMIES_PHASE_1;
    }

    function getFireInterval() {
        // Fire rate increases at level up (not after upgrade selected)
        if (game.level >= 3) return 0.2;
        if (game.level >= 2) return 0.3;
        return 0.4;
    }

    function getXpNeeded() {
        if (game.level === 1) return CONFIG.XP_TO_LEVEL_2;
        if (game.level === 2) return CONFIG.XP_TO_LEVEL_3;
        return CONFIG.XP_TO_LEVEL_4;
    }

    // ============================================
    // Player
    // ============================================
    function updatePlayer() {
        const minX = game.width * 0.15;
        const maxX = game.width * 0.85;

        // Move horizontally only (arcade style)
        if (game.player.moveDirX !== 0) {
            const speed = CONFIG.PLAYER_SPEED;
            game.player.x += game.player.moveDirX * speed;

            // Track facing direction
            if (game.player.moveDirX < 0) {
                game.player.facingLeft = true;
            } else if (game.player.moveDirX > 0) {
                game.player.facingLeft = false;
            }
        }

        // Keep player in horizontal bounds only (y is fixed)
        game.player.x = Math.max(minX, Math.min(maxX, game.player.x));
    }

    // ============================================
    // Bullets
    // ============================================
    function fireAtNearestEnemy() {
        // Determine bullet type based on selected orbitals
        let bulletType = null; // Default (standard bullet)
        if (game.selectedOrbitalTypes.length > 0) {
            bulletType = game.selectedOrbitalTypes[bulletIndex % game.selectedOrbitalTypes.length];
            bulletIndex++;
        }

        // Fire straight up
        game.bullets.push({
            x: game.player.x,
            y: game.player.y,
            vx: 0,
            vy: -CONFIG.BULLET_SPEED,
            radius: 6,
            type: bulletType
        });

        // Update bar selection if active
        if (game.barSelectionActive) {
            increaseBarForPosition(game.player.x);
        }
    }

    function updateBullets() {
        for (let i = game.bullets.length - 1; i >= 0; i--) {
            const bullet = game.bullets[i];
            bullet.x += bullet.vx;
            bullet.y += bullet.vy;

            // Remove if out of bounds
            if (bullet.x < -20 || bullet.x > game.width + 20 ||
                bullet.y < -20 || bullet.y > game.height + 20) {
                game.bullets.splice(i, 1);
            }
        }
    }

    // ============================================
    // Enemies
    // ============================================
    function spawnEnemy() {
        const margin = CONFIG.ENEMY_SPAWN_MARGIN;

        // Always spawn from top only (arcade style)
        const minX = game.width * 0.1;
        const maxX = game.width * 0.9;
        const x = minX + Math.random() * (maxX - minX);
        const y = -margin;

        // Enemy type based on phase
        const upgradeCount = game.selectedOrbitalTypes.length;
        let enemyType = 1;
        if (upgradeCount >= 2) enemyType = 3;
        else if (upgradeCount >= 1) enemyType = 2;

        game.enemies.push({
            x: x,
            y: y,
            radius: 18,
            hp: 1,
            type: enemyType
        });
    }

    function updateEnemies() {
        for (const enemy of game.enemies) {
            const dx = game.player.x - enemy.x;
            const dy = game.player.y - enemy.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 0) {
                enemy.x += (dx / dist) * CONFIG.ENEMY_SPEED * 2; // 2x faster horizontal
                enemy.y += (dy / dist) * CONFIG.ENEMY_SPEED;
            }
        }
    }

    function killEnemy(index) {
        const enemy = game.enemies[index];

        // Spawn explosion at enemy position
        spawnExplosion(enemy.x, enemy.y);

        // Spawn XP orb - clamp to visible area
        const padding = 10;
        game.xpOrbs.push({
            x: Math.max(padding, Math.min(game.width - padding, enemy.x)),
            y: Math.max(padding, Math.min(game.height - padding, enemy.y)),
            radius: 8,
            timer: 0,
            phase: 0  // 0 = delay, 1 = move away, 2 = move toward player
        });

        game.enemies.splice(index, 1);
        game.kills++;

        // Track kills after second upgrade for CTA
        if (game.selectedOrbitalTypes.length >= 2) {
            game.killsAfterSecondUpgrade++;
        }
    }

    // ============================================
    // XP Orbs
    // ============================================
    function updateXPOrbs() {
        for (let i = game.xpOrbs.length - 1; i >= 0; i--) {
            const orb = game.xpOrbs[i];

            const dx = game.player.x - orb.x;
            const dy = game.player.y - orb.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            // Update timer and phase
            orb.timer += game.deltaTime;

            if (orb.phase === 0) {
                // Phase 0: Delay (0.1 sec) - stay still
                if (orb.timer >= 0.1) {
                    orb.timer = 0;
                    orb.phase = 1;
                }
            } else if (orb.phase === 1) {
                // Phase 1: Move away from player (0.1 sec)
                if (dist > 0) {
                    orb.x -= (dx / dist) * CONFIG.XP_ATTRACT_SPEED * 0.1;
                    orb.y -= (dy / dist) * CONFIG.XP_ATTRACT_SPEED * 0.1;
                }
                if (orb.timer >= 0.1) {
                    orb.phase = 2;
                }
            } else {
                // Phase 2: Fly toward player
                if (dist > 0) {
                    orb.x += (dx / dist) * CONFIG.XP_ATTRACT_SPEED;
                    orb.y += (dy / dist) * CONFIG.XP_ATTRACT_SPEED;
                }
            }

            // Collect XP
            if (dist < game.player.radius + orb.radius) {
                game.xpOrbs.splice(i, 1);
                collectXP();
            }
        }
    }

    function collectXP() {
        // Don't count XP during bar selection
        if (game.barSelectionActive) {
            playSound('coin');
            return;
        }

        game.xp++;
        playSound('coin');
        updateUI();

        // Check if XP threshold reached
        if (game.xp >= getXpNeeded() && !game.waitingForExplosions) {
            // Kill all remaining enemies on screen
            killAllEnemies();
            game.waitingForExplosions = true;
        }
    }

    function killAllEnemies() {
        // Kill all enemies and spawn explosions (no XP orbs)
        // For first upgrade (no orbitals selected yet), force fire explosions
        const forceFireExplosion = game.selectedOrbitalTypes.length === 0;

        for (const enemy of game.enemies) {
            if (forceFireExplosion) {
                spawnExplosionOfType(enemy.x, enemy.y, 'fire');
            } else {
                spawnExplosion(enemy.x, enemy.y);
            }
        }
        game.enemies = [];
    }

    function spawnExplosionOfType(x, y, explosionType) {
        game.explosions.push({
            x: x,
            y: y,
            frame: 0,
            timer: 0,
            size: 135,
            type: explosionType
        });
        playSound('explosion');
    }

    function levelUp() {
        game.level++;
        game.xp = 0;
        updateUI();
        startBarSelection();
    }

    function showSkillSelection() {
        const container = document.getElementById('skill-buttons');
        container.innerHTML = '';

        let availableSkills = [];

        if (game.selectedOrbitalTypes.length === 0) {
            // First selection: fire, ice, poison
            availableSkills = ['fire', 'ice', 'poison'];
        } else {
            // Second selection: remaining from first + shock
            const firstPick = game.selectedOrbitalTypes[0];
            availableSkills = ['fire', 'ice', 'poison'].filter(s => s !== firstPick);
            availableSkills.push('shock');
        }

        // Create buttons
        availableSkills.forEach(skillType => {
            const skill = CONFIG.ORBITAL_TYPES[skillType];
            const btn = document.createElement('button');
            btn.className = 'upgrade-btn ' + skill.cssClass;

            // Add rarity on ribbon
            const raritySpan = document.createElement('span');
            raritySpan.className = 'rarity';
            raritySpan.textContent = 'Epic';
            btn.appendChild(raritySpan);

            // Add skill name below rarity
            const nameSpan = document.createElement('span');
            nameSpan.className = 'skill-name';
            nameSpan.textContent = skill.name;
            btn.appendChild(nameSpan);

            // Add icon
            const iconDiv = document.createElement('div');
            iconDiv.className = 'icon';
            const iconImg = document.createElement('img');
            iconImg.src = skill.sprite;
            iconDiv.appendChild(iconImg);
            btn.appendChild(iconDiv);

            // Add description
            const descSpan = document.createElement('span');
            descSpan.className = 'description';
            descSpan.textContent = skill.description || 'Elemental power';
            btn.appendChild(descSpan);

            btn.addEventListener('click', () => selectSkill(skillType));
            container.appendChild(btn);
        });

        document.getElementById('upgrade-panel').style.display = 'block';
    }

    function selectSkill(skillType) {
        playSound('buttonClick');
        document.getElementById('upgrade-panel').style.display = 'none';
        game.selectedOrbitalTypes.push(skillType);
        game.paused = false;
        // No orbitals in this version - just bullet/explosion colors change
    }

    function startBarSelection() {
        game.barSelectionActive = true;
        game.barSelectionComplete = false;
        game.barY = -100; // Start above the screen

        let availableSkills = [];
        if (game.selectedOrbitalTypes.length === 0) {
            availableSkills = ['fire', 'ice', 'poison'];
        } else {
            const firstPick = game.selectedOrbitalTypes[0];
            availableSkills = ['fire', 'ice', 'poison'].filter(s => s !== firstPick);
            availableSkills.push('shock');
        }

        // Initialize bars with equal width (33.3% each)
        game.barOptions = availableSkills.map(type => ({
            type: type,
            width: 33.33,
            name: CONFIG.ORBITAL_TYPES[type].name,
            color: CONFIG.ORBITAL_TYPES[type].color,
            animTimer: 0,
            isHit: false
        }));
    }

    function updateBarSelection() {
        if (!game.barSelectionActive || game.barSelectionComplete) return;

        // Move bars down at same speed as background
        if (!game.barWinnerType) {
            game.barY += 0.75;
        }

        // Check if we have a winner (two bars at 0)
        const activeBars = game.barOptions.filter(b => b.width > 0);
        if (activeBars.length === 1 && !game.barWinnerType) {
            // Start winner animation
            game.barWinnerType = activeBars[0].type;
            game.barWinnerAnimation = 0.6; // Duration of winner animation
            activeBars[0].animTimer = 0.6; // Trigger big animation
            activeBars[0].isHit = true;
            return;
        }

        // Check if bars reached player (player touches the bar)
        const barHeight = 100;
        const playerTopY = game.player.y - 40; // Approximate top of player
        if (game.barY + barHeight >= playerTopY && !game.barWinnerType) {
            // Find which bar the player is touching based on position
            const totalWidth = game.width * 0.76;
            const startX = game.width * 0.12;
            const relativeX = (game.player.x - startX) / totalWidth;
            const clampedX = Math.max(0, Math.min(1, relativeX));

            let accumulatedWidth = 0;
            let touchedBar = null;
            for (let i = 0; i < game.barOptions.length; i++) {
                const barWidthPercent = game.barOptions[i].width / 100;
                if (game.barOptions[i].width > 0 && clampedX < accumulatedWidth + barWidthPercent) {
                    touchedBar = game.barOptions[i];
                    break;
                }
                accumulatedWidth += barWidthPercent;
                if (game.barOptions[i].width > 0) touchedBar = game.barOptions[i];
            }

            if (touchedBar) {
                // Start winner animation for touched bar
                game.barWinnerType = touchedBar.type;
                game.barWinnerAnimation = 0.6;
                touchedBar.animTimer = 0.6;
                touchedBar.isHit = true;
            }
        }
    }

    function updateWinnerAnimation() {
        if (!game.barWinnerType || game.barSelectionComplete) return;

        game.barWinnerAnimation -= game.deltaTime;
        if (game.barWinnerAnimation <= 0) {
            game.barSelectionComplete = true;
            game.selectedOrbitalTypes.push(game.barWinnerType);
            game.barSelectionActive = false;
            game.barOptions = [];
            game.barWinnerType = null;
        }
    }

    function increaseBarForPosition(playerX) {
        if (!game.barSelectionActive || game.barSelectionComplete || game.barWinnerType) return;

        // Determine which bar to increase based on player position relative to actual bar widths
        const totalWidth = game.width * 0.76;
        const startX = game.width * 0.12;

        // Convert player position to position within bar area (0 to 1)
        const relativeX = (playerX - startX) / totalWidth;
        const clampedX = Math.max(0, Math.min(1, relativeX));

        // Find which bar the position falls into based on actual widths
        let barIndex = 0;
        let accumulatedWidth = 0;
        for (let i = 0; i < game.barOptions.length; i++) {
            const barWidthPercent = game.barOptions[i].width / 100;
            if (clampedX < accumulatedWidth + barWidthPercent) {
                barIndex = i;
                break;
            }
            accumulatedWidth += barWidthPercent;
            barIndex = i; // Default to last bar if we go past
        }

        // Only increase if bar still active
        if (game.barOptions[barIndex] && game.barOptions[barIndex].width > 0) {
            // 5% increase for first upgrade, 3% for second
            const increaseAmount = game.selectedOrbitalTypes.length === 0 ? 5 : 3;
            game.barOptions[barIndex].width += increaseAmount;

            // Decrease others proportionally
            const othersToDecrease = game.barOptions.filter((b, i) => i !== barIndex && b.width > 0);
            const decreaseAmount = increaseAmount / othersToDecrease.length;

            othersToDecrease.forEach(bar => {
                bar.width = Math.max(0, bar.width - decreaseAmount);
            });

            // Normalize to ensure total is 100%
            const total = game.barOptions.reduce((sum, b) => sum + b.width, 0);
            if (total > 0) {
                game.barOptions.forEach(b => {
                    b.width = (b.width / total) * 100;
                });
            }

            // Trigger animation on all bars
            game.barOptions.forEach((bar, i) => {
                bar.animTimer = 0.15; // Animation duration
                bar.isHit = (i === barIndex); // Mark the hit bar
            });
        }

        updateBarSelection();
    }

    function updateBarAnimations() {
        if (!game.barSelectionActive) return;

        for (const bar of game.barOptions) {
            if (bar.animTimer > 0) {
                bar.animTimer -= game.deltaTime;
                if (bar.animTimer < 0) bar.animTimer = 0;
            }
        }
    }

    function regenerateOrbitals() {
        game.orbitals = [];

        // Each skill type creates one orbital group (image contains 4 orbs)
        for (let t = 0; t < game.selectedOrbitalTypes.length; t++) {
            const skillType = game.selectedOrbitalTypes[t];
            const color = CONFIG.ORBITAL_TYPES[skillType].color;

            // Second skill gets 45° (π/4) offset to interleave with first
            const baseAngle = t * (Math.PI / 4);

            game.orbitals.push({
                angle: baseAngle,
                radius: 12,  // Individual orb radius for collision detection
                imageSize: 150,  // Size to draw the grouped orbital image
                type: skillType,
                color: color
            });
        }
    }

    // ============================================
    // Animations
    // ============================================
    function updateAnimations() {
        const frameRate = 8;

        // Player animation - always on
        game.playerAnimTime += game.deltaTime;
        game.playerAnimFrame = Math.floor(game.playerAnimTime * frameRate) % 6;

        // Enemy animation - always running
        game.enemyAnimTime += game.deltaTime;
        game.enemyAnimFrame = Math.floor(game.enemyAnimTime * frameRate) % 6;
    }

    // ============================================
    // Explosions
    // ============================================
    function spawnExplosion(x, y) {
        // No explosion before first orbital is selected
        if (game.selectedOrbitalTypes.length === 0) return;

        // Cycle through selected orbital types
        const explosionType = game.selectedOrbitalTypes[explosionIndex % game.selectedOrbitalTypes.length];
        explosionIndex++;

        game.explosions.push({
            x: x,
            y: y,
            frame: 0,
            timer: 0,
            size: 135,
            type: explosionType
        });
        playSound('explosion');
    }

    function updateExplosions() {
        const frameRate = 10; // 10 FPS for explosions
        const frameDuration = 1 / frameRate;

        for (let i = game.explosions.length - 1; i >= 0; i--) {
            const explosion = game.explosions[i];
            explosion.timer += game.deltaTime;

            if (explosion.timer >= frameDuration) {
                explosion.timer = 0;
                explosion.frame++;

                // Remove when all 6 frames played
                if (explosion.frame >= EXPLOSION_FRAME_COUNT) {
                    game.explosions.splice(i, 1);
                }
            }
        }
    }

    // ============================================
    // Orbitals
    // ============================================
    function updateOrbitals() {
        for (const orbital of game.orbitals) {
            orbital.angle += CONFIG.ORBITAL_SPEED * game.deltaTime;  // Rotate clockwise
        }
    }

    // Returns array of 4 orb positions for collision detection (orbs at 0°, 90°, 180°, 270° in the image)
    function getOrbitalPositions(orbital) {
        const positions = [];
        for (let i = 0; i < 4; i++) {
            const orbAngle = orbital.angle + (i * Math.PI / 2);  // 90° apart
            positions.push({
                x: game.player.x + Math.cos(orbAngle) * CONFIG.ORBITAL_RADIUS,
                y: game.player.y + Math.sin(orbAngle) * CONFIG.ORBITAL_RADIUS
            });
        }
        return positions;
    }

    // ============================================
    // Collisions
    // ============================================
    function checkCollisions() {
        // Bullets vs Enemies
        for (let i = game.bullets.length - 1; i >= 0; i--) {
            const bullet = game.bullets[i];

            for (let j = game.enemies.length - 1; j >= 0; j--) {
                const enemy = game.enemies[j];
                const dx = bullet.x - enemy.x;
                const dy = bullet.y - enemy.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < bullet.radius + enemy.radius) {
                    game.bullets.splice(i, 1);
                    killEnemy(j);
                    break;
                }
            }
        }
    }

    // ============================================
    // UI
    // ============================================
    function updateUI() {
        let xpNeeded;
        if (game.level === 1) xpNeeded = CONFIG.XP_TO_LEVEL_2;
        else if (game.level === 2) xpNeeded = CONFIG.XP_TO_LEVEL_3;
        else xpNeeded = CONFIG.XP_TO_LEVEL_4;

        const xpPercent = (game.xp / xpNeeded) * 100;
        document.getElementById('xp-bar').style.width = xpPercent + '%';
        document.getElementById('level-display').textContent = 'LVL ' + game.level;
    }

    function showCTA() {
        game.ctaShown = true;
        game.paused = true;
        const ctaScreen = document.getElementById('cta-screen');
        ctaScreen.style.display = 'flex';
        // Small delay to allow display change, then fade in
        setTimeout(() => {
            ctaScreen.classList.add('visible');
        }, 50);
    }

    function handleCTA() {
        // Detect platform
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const storeUrl = isIOS ? CONFIG.STORE_URL_IOS : CONFIG.STORE_URL_ANDROID;
        openStore(storeUrl);
    }

    // ============================================
    // Rendering
    // ============================================
    function render() {
        const ctx = game.ctx;

        // Draw background - scrolling down slowly, preserving aspect ratio
        if (sprites.background) {
            const img = sprites.background;
            // Scale to fit width, preserve aspect ratio
            const bgWidth = game.width;
            const bgHeight = (img.height / img.width) * bgWidth;

            // Calculate starting Y position (wrap smoothly)
            let startY = game.backgroundY % bgHeight;
            if (startY > 0) startY -= bgHeight;

            // Draw enough copies to cover the screen
            for (let y = startY; y < game.height; y += bgHeight) {
                ctx.drawImage(img, 0, y, bgWidth, bgHeight);
            }
        } else {
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, game.width, game.height);
        }

        // Draw XP orbs (0.2x scale)
        for (const orb of game.xpOrbs) {
            if (sprites.xpOrb) {
                const size = orb.radius * 1.5;
                ctx.drawImage(sprites.xpOrb, orb.x - size/2, orb.y - size/2, size, size);
            } else {
                ctx.fillStyle = CONFIG.COLOR_XP;
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Draw enemies - preserve aspect ratio (0.5x scale) with animation
        for (const enemy of game.enemies) {
            let enemyImg = null;
            const enemyType = enemy.type || 1;

            // Get animated frame based on enemy type
            if (enemyType === 1 && goblinWalkFrames.length > 0) {
                enemyImg = goblinWalkFrames[game.enemyAnimFrame];
            } else if (enemyType === 2 && rangeWalkFrames.length > 0) {
                enemyImg = rangeWalkFrames[game.enemyAnimFrame];
            } else if (enemyType === 3 && skeletonWalkFrames.length > 0) {
                enemyImg = skeletonWalkFrames[game.enemyAnimFrame];
            } else {
                // Fallback to static sprite
                enemyImg = sprites['enemy' + enemyType];
            }

            if (enemyImg) {
                const img = enemyImg;
                // Goblin: 2, Range: 2.5, Skeleton: 5
                const sizeMultiplier = (enemyType === 3) ? 4 : (enemyType === 2) ? 2.25 : 2;
                const scale = (enemy.radius * sizeMultiplier) / Math.max(img.width, img.height);
                const w = img.width * scale;
                const h = img.height * scale;

                // Flip sprite based on movement direction (flip when moving right)
                const movingRight = game.player.x > enemy.x;
                ctx.save();
                ctx.translate(enemy.x, enemy.y);
                if (movingRight) {
                    ctx.scale(-1, 1);
                }
                ctx.drawImage(img, -w/2, -h/2, w, h);
                ctx.restore();
            } else {
                ctx.fillStyle = CONFIG.COLOR_ENEMY;
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Draw explosions
        for (const explosion of game.explosions) {
            const frames = explosionFrames[explosion.type];
            if (frames && frames.length > 0 && explosion.frame < frames.length) {
                const img = frames[explosion.frame];
                const size = explosion.size;
                ctx.drawImage(img, explosion.x - size/2, explosion.y - size/2, size, size);
            }
        }

        // Draw bullets
        for (const bullet of game.bullets) {
            // Get bullet sprite based on type
            let bulletSprite = sprites.bullet;
            if (bullet.type && sprites['bullet_' + bullet.type]) {
                bulletSprite = sprites['bullet_' + bullet.type];
            }

            if (bulletSprite) {
                const size = bullet.radius * 2;
                const angle = Math.atan2(bullet.vy, bullet.vx);
                ctx.save();
                ctx.translate(bullet.x, bullet.y);
                ctx.rotate(angle);
                ctx.drawImage(bulletSprite, -size/2, -size/2, size, size);
                ctx.restore();
            } else {
                ctx.fillStyle = CONFIG.COLOR_BULLET;
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Draw player - preserve aspect ratio (2x size) with animation, flip based on direction
        const playerImg = charWalkFrames.length > 0 ? charWalkFrames[game.playerAnimFrame] : sprites.player;
        if (playerImg) {
            const img = playerImg;
            const scale = (game.player.radius * 4) / Math.max(img.width, img.height);
            const w = img.width * scale;
            const h = img.height * scale;

            ctx.save();
            ctx.translate(game.player.x, game.player.y);
            if (game.player.facingLeft) {
                ctx.scale(-1, 1); // Flip horizontally
            }
            ctx.drawImage(img, -w/2, -h/2, w, h);
            ctx.restore();
        } else {
            ctx.fillStyle = CONFIG.COLOR_PLAYER;
            ctx.beginPath();
            ctx.arc(game.player.x, game.player.y, game.player.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw bar selection UI
        if (game.barSelectionActive && game.barOptions.length > 0) {
            const barHeight = 100;
            const barY = game.barY; // Moving from top towards player
            const totalWidth = game.width * 0.76;
            const startX = game.width * 0.12;
            const iconSize = 48;
            const borderRadius = 12;

            let currentX = startX;

            for (let i = 0; i < game.barOptions.length; i++) {
                const bar = game.barOptions[i];
                const barWidth = (bar.width / 100) * totalWidth;

                if (barWidth > 2) {
                    // Calculate animation scale (bounce effect)
                    const isWinner = game.barWinnerType === bar.type;
                    const animDuration = isWinner ? 0.6 : 0.15;
                    const animProgress = Math.min(bar.animTimer / animDuration, 1); // 0 to 1

                    // Winner gets one big pulse animation
                    let animScale = 1;
                    if (isWinner && animProgress > 0) {
                        // Single pulse effect for winner
                        const pulse = Math.sin(animProgress * Math.PI);
                        animScale = 1 + pulse * 0.25;
                    } else {
                        const baseScale = bar.isHit ? 1.08 : 1.03;
                        animScale = 1 + (baseScale - 1) * animProgress;
                    }

                    // Calculate animated position (centered scaling)
                    const centerX = currentX + barWidth / 2;
                    const centerY = barY + barHeight / 2;
                    const animWidth = barWidth * animScale;
                    const animHeight = barHeight * animScale;
                    const animX = centerX - animWidth / 2;
                    const animY = centerY - animHeight / 2;

                    // Draw rounded rectangle bar background
                    const barColors = {
                        '#ef4444': '#dc2626', // fire - red
                        '#3b82f6': '#38bdf8', // ice - light blue
                        '#a855f7': '#a855f7', // poison - purple
                        '#eab308': '#facc15'  // shock - yellow
                    };
                    ctx.fillStyle = barColors[bar.color] || bar.color;
                    ctx.globalAlpha = 0.9;
                    ctx.beginPath();
                    ctx.roundRect(animX, animY, animWidth, animHeight, borderRadius);
                    ctx.fill();
                    ctx.globalAlpha = 1;

                    // Draw border (size increases when animating)
                    const borderHighlight = animProgress > 0;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = borderHighlight ? (bar.isHit ? 4 : 3) : 2;
                    ctx.beginPath();
                    ctx.roundRect(animX, animY, animWidth, animHeight, borderRadius);
                    ctx.stroke();

                    // Draw icon with white rounded background if bar is wide enough
                    if (barWidth > iconSize + 10) {
                        const iconKey = 'bullets_' + bar.type;
                        if (sprites[iconKey]) {
                            const iconBgBaseSize = 50; // Fixed background size
                            const scaledIconSize = iconSize * animScale;
                            const scaledIconBgSize = iconBgBaseSize * animScale;
                            const iconBgX = centerX - scaledIconBgSize / 2;
                            const iconBgY = animY + 10 * animScale;

                            // White rounded background for icon
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                            ctx.beginPath();
                            ctx.roundRect(iconBgX, iconBgY, scaledIconBgSize, scaledIconBgSize, 8 * animScale);
                            ctx.fill();

                            // Draw icon (centered in background)
                            const iconOffset = (scaledIconBgSize - scaledIconSize) / 2;
                            const iconX = iconBgX + iconOffset;
                            const iconY = iconBgY + iconOffset;
                            ctx.drawImage(sprites[iconKey], iconX, iconY, scaledIconSize, scaledIconSize);
                        }
                    }

                    // Draw name inside bar if bar is wide enough
                    if (barWidth > 50) {
                        ctx.fillStyle = '#fff';
                        const scaledFontSize = Math.round(20 * animScale);
                        ctx.font = 'bold ' + scaledFontSize + 'px "Lilita One", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(bar.name, centerX, animY + animHeight - 20 * animScale);
                    }
                }

                currentX += barWidth;
            }
        }
    }

    function drawGrid() {
        const ctx = game.ctx;
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;

        const gridSize = 40;
        for (let x = 0; x < game.width; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, game.height);
            ctx.stroke();
        }
        for (let y = 0; y < game.height; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(game.width, y);
            ctx.stroke();
        }
    }

    // ============================================
    // Start
    // ============================================
    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
